# Frigate + an MQTT broker, for the box that watches the fridge.
#
#   cd frigate
#   cp .env.example .env        # put the camera password in here
#   docker compose up -d
#
# Frigate does not ship a broker, and fridge-watcher needs one, so Mosquitto
# is included. If you already run a broker on this network, delete the `mqtt`
# service and point config.yml at the one you have.

services:
  frigate:
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:stable
    restart: unless-stopped
    # Frigate writes decoded frames to shared memory. One camera at sub-stream
    # resolution needs only a few MB; this is deliberately generous.
    shm_size: "128mb"
    devices:
      # Intel / AMD integrated graphics, for hardware video decoding.
      # Comment this out on a Raspberry Pi -- there is no /dev/dri there.
      - /dev/dri/renderD128
      # Uncomment the line matching your Coral, if you add one later.
      # - /dev/bus/usb:/dev/bus/usb   # USB Coral
      # - /dev/apex_0:/dev/apex_0     # M.2 / PCIe Coral
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config.yml:/config/config.yml:ro
      # Recordings live here. On a Pi, point this at an SSD or a USB disk --
      # continuous video writes will destroy an SD card in a few months.
      - ./storage:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      # 8971: the web UI, with login. This is the one you open in a browser.
      - "8971:8971"
      # 5000: the same API without authentication. fridge-watcher talks to
      # this one, which is why FRIGATE_URL uses port 5000. It has no login,
      # so keep it on your LAN and do not forward it through your router.
      - "5000:5000"
      - "8554:8554"       # go2rtc RTSP restream
      - "8555:8555/tcp"   # WebRTC
      - "8555:8555/udp"
    environment:
      # Read from frigate/.env -- keeps the camera password out of config.yml
      # and out of git.
      FRIGATE_RTSP_PASSWORD: "${FRIGATE_RTSP_PASSWORD}"

  mqtt:
    container_name: mosquitto
    image: eclipse-mosquitto:2
    restart: unless-stopped
    # Anonymous access, which is fine on a trusted home LAN. To add a
    # username and password, mount your own mosquitto.conf here and set
    # MQTT_USER / MQTT_PASSWORD in the fridge-watcher .env.
    command: mosquitto -c /mosquitto-no-auth.conf
    ports:
      - "1883:1883"
