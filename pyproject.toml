[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fridge-watcher"
version = "0.1.0"
description = "Turn Frigate camera events into FridgeFriend inventory updates"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2.0",
    "httpx>=0.27",
    # Headless build: this runs as a service, and the GUI variant drags in
    # libGL etc. which are not present in a slim container or a headless Pi.
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "anthropic>=0.40",
    "supabase>=2.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fridge-watcher = "fridge_watcher.cli:main"

[tool.setuptools.packages.find]
include = ["fridge_watcher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
